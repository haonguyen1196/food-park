name: Deploy to VPS

on:
  push:
    branches:
      - main # Chạy khi có push lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: linuxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/food-park

            # Pull code mới nhất từ GitHub
            git pull origin main

            # Cài đặt dependencies backend
            composer install --no-dev --optimize-autoloader

            # Chạy migrate database
            php artisan migrate --force

            # Cache config, route, view để tăng tốc
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            # Cài đặt dependencies frontend & build tại thư mục gốc
            npm install
            npm run build

            # Set quyền cho webserver
            sudo chown -R www-data:www-data /var/www/food-park
            sudo chmod -R 775 /var/www/food-park/storage /var/www/food-park/bootstrap/cache

            # Restart server
            sudo systemctl restart nginx
