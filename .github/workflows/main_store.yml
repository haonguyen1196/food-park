name: Deploy to VPS

on:
  push:
    branches:
      - main # Chạy khi có push lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: linuxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/food-park

            # Reset quyền nếu cần
            sudo chown -R linuxuser:www-data .
            sudo chmod -R 775 storage bootstrap/cache

            # Pull code mới
            git stash            # Lưu thay đổi tạm thời
            git pull origin main # Kéo code mới về
            git stash pop

            # Cài đặt dependencies
            composer install --no-dev --optimize-autoloader
            npm install
            npm run build

            # Migrate database nếu cần
            php artisan migrate --force

            # Reset quyền sau deploy
            sudo chown -R www-data:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache

            # Restart web server
            sudo systemctl restart php8.1-fpm
            sudo systemctl restart nginx
